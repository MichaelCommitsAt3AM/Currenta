name: Deploy to home server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Sync repo and restart services
        run: |
          set -e
          cd ~/currenta
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build api worker redis caddy db auth rest storage

      - name: Flush cached feed sessions
        run: |
          set -e
          cd ~/currenta
          # Ranking/personalization changes are otherwise invisible for up to 4h,
          # because a client replaying its session_id gets the ordering that was
          # precomputed by the OLD code. Targeted on purpose — see the script.
          scripts/flush-feed-cache.sh
