name: currenta
description: "Currenta — General News Shorts. 64-word AI summaries, semantically grouped."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Backend / Database ──────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── Local Database (Offline-First) ──────────────────────────────
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.29

  # ── Networking ──────────────────────────────────────────────────
  dio: ^5.8.0+1

  # ── Models ──────────────────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  # ── UI / Images ─────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  animations: ^2.0.11

  # ── Background Tasks ────────────────────────────────────────────
  workmanager: ^0.9.0+3

  # ── Utilities ───────────────────────────────────────────────────
  intl: ^0.20.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path: ^1.9.1
  flutter_custom_tabs: ^2.5.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.5.0
  firebase_crashlytics: ^5.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.3
  drift_dev: ^2.23.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_logo.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/app_logo.jpg"
  android: true
  ios: true
  fullscreen: true
