name: currenta
description: "Currenta — General News Shorts. 64-word AI summaries, semantically grouped."
publish_to: 'none'
version: 0.1.7+15

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.4

  # ── State Management ────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Backend / Database ──────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── Local Database (Offline-First) ──────────────────────────────
  drift: ^2.23.1

  # ── Networking ──────────────────────────────────────────────────
  dio: ^5.8.0+1
  dio_http2_adapter: ^2.5.0

  # ── Models ──────────────────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  # ── UI / Images ─────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  animations: ^2.0.11

  # ── Background Tasks ────────────────────────────────────────────
  workmanager: ^0.9.0+3

  # ── Utilities ───────────────────────────────────────────────────
  intl: ^0.20.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path: ^1.9.1
  flutter_custom_tabs: ^2.5.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.5.0
  firebase_crashlytics: ^5.0.8
  shared_preferences: ^2.5.4
  auto_size_text: ^3.0.0
  flutter_markdown: ^0.7.7+1
  package_info_plus: ^9.0.0
  flutter_secure_storage: ^10.0.0
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.9.4
  firebase_app_check: ^0.4.3
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.3
  drift_dev: ^2.23.1
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
        - asset: assets/fonts/inter/Inter-Italic-Variable.ttf
          style: italic
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Variable.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon_2.png"
  min_sdk_android: 21



flutter_native_splash:
  color: "#0A0C14"
  image: "assets/icons/app_logo_new.png"
  android: true
  ios: true
  fullscreen: true
  
  # Android 12+ Support
  android_12:
    image: "assets/icons/app_logo_new.png"
    color: "#0A0C14"
    icon_background_color: "#0A0C14"



