services:
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - JWT_SECRET=${JWT_SECRET:-}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - REDIS_URL=redis://redis:6379
      - LOCAL_LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LOCAL_LLM_MODEL=${OLLAMA_MODEL:-llama3.1}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-voyage}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - VOYAGE_EMBED_MODEL=${VOYAGE_EMBED_MODEL:-voyage-4-lite}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - TRUST_PROXY_HEADERS=true
      - TRUSTED_PROXY_IPS=*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - JWT_SECRET=${JWT_SECRET:-}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - REDIS_URL=redis://redis:6379
      - LOCAL_LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LOCAL_LLM_MODEL=${OLLAMA_MODEL:-llama3.1}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-voyage}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - VOYAGE_EMBED_MODEL=${VOYAGE_EMBED_MODEL:-voyage-4-lite}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    command: python -m backend.worker
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      # Laptop dev (ngrok) uses 8000 by default; the home server sets
      # CADDY_HOST_PORT=80 in its .env since cloudflared's tunnel points at localhost:80.
      - "${CADDY_HOST_PORT:-8000}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network
    restart: unless-stopped

  # ── Self-hosted Supabase (home server only — see CLAUDE.md) ──────────────
  # Trimmed to what this app actually uses: Postgres+pgvector, Auth (GoTrue),
  # PostgREST, and file-backed Storage. Skips Kong/Envoy (Caddy already routes
  # /auth/v1, /rest/v1, /storage/v1 — see Caddyfile), Realtime, Studio, Meta,
  # and edge-functions (unused by this app).
  db:
    container_name: supabase-db
    image: supabase/postgres:17.6.1.136
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./supabase/self-host/init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/self-host/init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./supabase/self-host/init/extensions.sql:/docker-entrypoint-initdb.d/init-scripts/99-extensions.sql:ro
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      [
        "postgres",
        "-c", "config_file=/etc/postgresql/postgresql.conf",
        "-c", "log_min_messages=fatal"
      ]
    networks:
      - app-network
    restart: unless-stopped

  auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.189.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:-https://currenta.tech}
      GOTRUE_URI_ALLOW_LIST: ${SUPABASE_ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      # ClientID is a []string in GoTrue (comma-separated here) — the redirect-
      # based OAuth flow (admin portal) always uses element [0], so the
      # primary client must stay first. GOTRUE_EXTERNAL_GOOGLE_ADDITIONAL_CLIENT_IDS
      # is NOT a real GoTrue config key (checked v2.189.0 source) and was
      # silently ignored; the mobile app's native ID-token flow uses different
      # (Firebase-linked) web clients as serverClientId per flavor, so both
      # need to be in this same list for their audience to be accepted.
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: 812531201277-ape80otgk9m7noocf6rqbnfq0hjidsfi.apps.googleusercontent.com,703509294568-3sq04ddpk60iguqmal7ctfthno0rn7p4.apps.googleusercontent.com,1061629660004-r8tu5ej7mle8m7emgqh1d47ut6voqhku.apps.googleusercontent.com
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_URL}/auth/v1/callback
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      # Required for Google Sign-In via ID token on mobile — see
      # lib/features/auth/data/repositories/auth_repository_impl.dart signInWithIdToken.
      GOTRUE_EXTERNAL_SKIP_NONCE_CHECK: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: ${MAILTRAP_SENDER_EMAIL:-no-reply@currenta.tech}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${MAILTRAP_SENDER_NAME:-Currenta}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
    networks:
      - app-network
    restart: unless-stopped

  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v14.12
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_PORT: "3001"
    networks:
      - app-network
    restart: unless-stopped

  storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.60.4
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: currenta
      REGION: local
      # No imgproxy in this trimmed stack — the app doesn't use on-the-fly
      # image transforms (backend/services/ingestion.py uploads pre-sized images).
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - supabase_storage_data:/var/lib/storage
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  supabase_db_data:
  supabase_storage_data:
