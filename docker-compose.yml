services:
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Pass through all environment variables from .env
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379  # Override for Docker network
      # If using local Ollama on host, host.docker.internal works on Docker Desktop.
      # For Linux host networking, this mapping is required.
      - LOCAL_LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LOCAL_LLM_MODEL=${OLLAMA_MODEL:-llama3.1}
      - LOCAL_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
