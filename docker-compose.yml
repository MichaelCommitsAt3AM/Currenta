services:
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - LOCAL_LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LOCAL_LLM_MODEL=${OLLAMA_MODEL:-llama3.1}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-voyage}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - VOYAGE_EMBED_MODEL=${VOYAGE_EMBED_MODEL:-voyage-4-lite}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - TRUST_PROXY_HEADERS=true
      - TRUSTED_PROXY_IPS=*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - VOYAGE_EMBED_MODEL=${VOYAGE_EMBED_MODEL:-voyage-4-lite}
    volumes:
      - .:/app
    command: python -m backend.worker
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8000:80"     # Map 8000 to Caddy's port 80 for existing ngrok setup
                      # Note: host ports 80/443 removed to avoid system conflicts.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
