steps:
# Use Kaniko to build the image with persistent layer caching.
# This avoids manual docker pull/push for caching and is generally much faster in GCB.
- name: 'gcr.io/kaniko-project/executor'
  args:
  - --destination=$_TAG
  - --dockerfile=backend/Dockerfile
  - --context=dir://.
  - --cache=true
  - --cache-ttl=24h

